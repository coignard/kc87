name: Release

permissions:
  contents: write
  id-token: write
  attestations: write

on:
  push:
    tags:
      - '[0-9]+.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: universal-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Verify assets integrity
        shell: bash
        run: |
          echo "22948c0d106c505c80150b6bfefbf725d59748c372a1de5134f60b56b6ad119f  firmware/kc87/os.rom" > SHA256SUMS
          echo "a704c01df63b954237da322a928944063f33825b5039ef741aaa682afd3fcc19  firmware/kc87/basic.rom" >> SHA256SUMS
          echo "a2164c10f747a921dcfaac4a653770f13d802e60182ad20878b9d201f27310d1  firmware/kc87/chargen.rom" >> SHA256SUMS
          echo "dd69a923b0cb75ca673bfc840da76843a1a3101ef92cb746eb67d38c27660960  firmware/z9001/os_1.rom" >> SHA256SUMS
          echo "aa6cd1fb8dfa0e59da71c3dcd4e2df98e6264ccc0d4ff1a6dc5e25bcb4782723  firmware/z9001/os_2.rom" >> SHA256SUMS
          echo "39ba8359420e379ebcc6445bcaeebba1e332b0f4c1602b685f922b8b2c5e21c2  firmware/z9001/basic.rom" >> SHA256SUMS
          echo "da7c87735a96d02dbb3815ad3df82182698c12a7fef2c3f6e64161d1912d40ad  firmware/z9001/chargen.rom" >> SHA256SUMS
          sha256sum --check SHA256SUMS || shasum -a 256 -c SHA256SUMS
      - name: Update Rust
        run: rustup update stable
      - name: Install ALSA
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/upload-rust-binary-action@v1
        id: upload
        with:
          bin: kc87
          target: ${{ matrix.target }}
          checksum: sha256
          all-features: false
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@v4
        with:
          subject-checksums: ${{ steps.upload.outputs.sha256 }}

  update-homebrew:
      needs: upload-assets
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
          with:
            submodules: recursive
        - name: Trigger tap update
          run: |
            gh workflow run update-formula.yml \
              --repo coignard/homebrew-tap \
              --field version=${{ github.ref_name }}
          env:
            GH_TOKEN: ${{ secrets.TAP_TOKEN }}
