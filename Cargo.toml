[package]
name = "kc87"
version = "0.2.1"
authors = [
    "René Coignard <contact@renecoignard.com>"
]
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "Robotron KC 87 emulator with MIDI support via PIO"
homepage = "https://coignard.org/kc87"
repository = "https://github.com/coignard/kc87"
readme = "README.md"
keywords = ["emulator", "kc87", "u855", "u857", "u880"]
categories = ["emulators"]
exclude = [".github/*"]

[dependencies]
anyhow = "1.0.102"
assert-json-diff = "2.0.2"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.17.3"
crossbeam-channel = "0.5.15"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
midir = "0.11.0"
midly = "0.5.3"
pixels = "0.17.1"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.150"
sha2 = "0.11.0"
spin_sleep = "1.3.3"
u880 = "0.1.3"
winit = "0.30.13"

[[bin]]
name = "kc87"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
