[package]
name = "kc87"
version = "0.7.1"
authors = [
    "René Coignard <contact@renecoignard.com>"
]
edition = "2024"
rust-version = "1.96"
license = "GPL-3.0-or-later"
description = "Robotron KC 87 emulator with MIDI support via E/A-Modul"
homepage = "https://coignard.org/kc87"
repository = "https://github.com/coignard/kc87"
readme = "README.md"
keywords = ["emulator", "kc87", "u855", "u857", "u880"]
categories = ["emulators"]
exclude = [".github/*"]

[dependencies]
anyhow = "1.0.103"
assert-json-diff = "2.0.2"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
filetime = "0.2.29"
flate2 = "1.1.9"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lzhuf = "0.1.0"
midir = "0.11.0"
midly = "0.5.3"
pixels = "0.17.1"
serde = { version = "1.0.228", features = ["derive"] }
serde-big-array = "0.5.1"
serde_json = "1.0.150"
sha2 = "0.11.0"
spin_sleep = "1.3.3"
test-generator = "0.3.1"
u880 = "0.1.4"
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9.1"
libc = "0.2.186"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-core-audio = "0.3.2"
objc2-core-audio-types = "0.3.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSArray",
    "NSString",
    "NSUUID",
    "NSValue",
] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "CFBase",
    "CFString",
    "CFArray",
    "CFDictionary",
    "CFNumber",
    "CFRunLoop",
    "CFDate",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
midir = "0.11.0"

[[bin]]
name = "kc87"
path = "src/main.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = 3
